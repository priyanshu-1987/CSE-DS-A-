<body>
    <script>
        const num=[10,20,30,5,32,95,43,6,1]
        const even=num.filter((i)=>(i%2==0));
        const squre=even.map((i)=>(i*i));
        const sum=squre.reduce((i,s)=>(i+s))
        console.log("sum",sum);
        
    </script>
