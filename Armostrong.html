<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var n=prompt("enter your no.")
        let original = n;
        let digits = n.toString().length;
        let sum = 0;

        while (n > 0) {
            let r = n % 10;
            sum = sum + Math.pow(r, digits);
            n = Math.floor(n / 10);
        }

        if (sum === original) {
            console.log(original + " is an Armstrong number");
        } else {
            console.log(original + " is not an Armstrong number");
        }
                
    </script>
</body>
</html>
