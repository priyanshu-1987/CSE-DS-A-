<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const student={
            name:"priyanshu",
            class1:"btech",
            fee:10000
        }
        const {name,class1,fee}=student  //destructuring of data
        document.write("<br>",name)
        document.write("<br>",class1)
        document.write("<br>",fee)

        const colors = ["Red", "Green", "Blue", "Yellow"];

        // We assign the first two items to variables
        const [primary, secondary] = colors;

        console.log(primary);   // Output: "Red"
        console.log(secondary); // Output: "Green"
    </script>
</body>
</html>
